spring.application.name=trabajo-obligatorio
# Carga las variables del archivo .env si existe (ver .env.example)
spring.config.import=optional:file:.env[.properties]
server.servlet.context-path=/hotel-manager


# Conexión a la Base de Datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotelweb?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA e Hibernate (Mapeo Objeto-Relacional)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT: la clave se lee de la variable de entorno JWT_SECRET (mínimo 32 caracteres).
# Nunca se guarda en el repositorio.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Configuración de Jackson para paridad con Gson original (snake_case)
spring.jackson.property-naming-strategy=SNAKE_CASE

# En Spring Boot 4, el 404 ya lanza la excepción por defecto sin necesidad de la propiedad mvc
spring.web.resources.add-mappings=false

# CORS: orígenes del frontend autorizados, separados por comas
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
